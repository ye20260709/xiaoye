<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小叶专用跳转站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  color:#0f0;
  font-family:Consolas,Monaco,monospace;
  font-size:16px;
  padding:15px;
  line-height:1.6;
}
#terminal{white-space:pre-wrap;}
.input-line{display:flex;gap:6px;margin-top:6px;}
.prompt{color:#0f0;}
#cmdInput{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#0f0;
  font-family:inherit;
  font-size:inherit;
}
#mainPanel{display:none;margin-top:20px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.box{
  border:1px solid #0f0;
  padding:16px;
}
.box h3{margin-bottom:12px;border-bottom:1px solid #0f0;padding-bottom:6px;}
button{
  display:block;
  width:100%;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:8px;
  margin:6px 0;
  cursor:pointer;
  font-family:inherit;
}
button:hover{background:#030;}
#regBtn{margin-top:10px;margin-bottom:12px;}
</style>
</head>
<body>
<div id="terminal">Microsoft Windows [版本 10.0.19045]
(c) Microsoft Corporation。保留所有权利。

C:\Users\Guest>
</div>
<div class="input-line">
  <span class="prompt">C:\Users\Guest></span>
  <input id="cmdInput" autofocus autocomplete="off">
</div>
<div id="mainPanel">
  <button id="regBtn">注册</button>
  <div class="grid">
    <div class="box">
      <h3>主</h3>
      <button onclick="location.href='https://baixxue.nocode.host'">白雪主站</button>
      <button onclick="location.href='https://baixue.kicp.fun'">验证站</button>
      <button onclick="location.href='https://mimacs.gicp.fun'">密码测试</button>
      <button onclick="location.href='https://tempmail.gicp.fun'">临时邮箱</button>
      <button onclick="location.href='https://cloudflare.com'">Cloudflare</button>
      <button onclick="location.href='https://www.bilibili.com/toy/gGPYh2RHiV8Wvp1A/index.html'">Bilibili toy</button>
    </div>
    <div class="box">
      <h3>备用</h3>
      <button onclick="location.href='https://www.github.com/ye20260728/xiaoye'">GitHub</button>
      <button onclick="location.href='https://www.bilibili.com'">B站主页</button>
      <button onclick="location.href='https://dash.Cloudflare.com'">Cloudflare2</button>
      <button onclick="location.href='https://www.baidu.com'">百度</button>
      <button onclick="location.href='https://www.itdog.cn'">itdog</button>
      <button onclick="location.href='https://www.13266489511.lanzoul.com'">i蓝奏云</button>
      <button onclick="location.href='https://www.xiaoye6.ficp.fun'">测试匆乱点，乱点《马飞了》ovo</button>
    </div>
  </div>
</div>

<script>
const cmdInput = document.getElementById('cmdInput');
const terminal = document.getElementById('terminal');
const mainPanel = document.getElementById('mainPanel');
const regBtn = document.getElementById('regBtn');
let step = 0;

cmdInput.onkeydown = async function(e){
  if(e.key !== 'Enter') return;
  const val = this.value.trim();
  terminal.textContent += val + '\n';
  this.value = '';
  if(step === 0){
    if(val === 'cd'){
      step = 1;
      terminal.textContent += 'C:\\Users\\Guest\\> 请输入账号：\n';
    }else{
      terminal.textContent += `'${val}' 不是内部或外部命令，也不是可运行的程序\nC:\\Users\\Guest>\n`;
    }
  }else if(step === 1){
    if(val === 'admin'){
      step = 2;
      terminal.textContent += 'C:\\Users\\Guest\\> 请输入密码：\n';
      this.type = 'password';
    }else{
      terminal.textContent += '账号错误\nC:\\Users\\Guest>\n';
      step = 0;
    }
  }else if(step === 2){
    this.type = 'text';
    if(val === 'admin'){
      terminal.textContent += '登录成功\n';
      document.querySelector('.input-line').style.display='none';
      mainPanel.style.display='block';
    }else{
      terminal.textContent += '密码错误\nC:\\Users\\Guest>\n';
      step = 0;
    }
  }
}

regBtn.onclick = ()=>{
  alert('小叶：你又不是管理员，看什么看！O∧O');
}
</script>
</body>
</html>
